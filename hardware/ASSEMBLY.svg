<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="SolarTerm Farm assembly drawing">
  <title>SolarTerm Farm module-level assembly drawing</title>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="44" font-family="sans-serif" font-size="26" font-weight="bold" fill="#173d32">SolarTerm Farm — assembly layout</text>
  <text x="40" y="70" font-family="sans-serif" font-size="14" fill="#555">Top view · not to scale · module-level build · CERN-OHL-S-2.0</text>

  <!-- Base plate -->
  <rect x="80" y="130" width="1240" height="650" rx="18" fill="#f7fbf8" stroke="#173d32" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="110" y="165" font-family="sans-serif" font-size="14" fill="#555">Base plate / enclosure floor</text>

  <!-- ESP board -->
  <rect x="130" y="210" width="360" height="210" rx="8" fill="#dcefe5" stroke="#173d32" stroke-width="3"/>
  <text x="155" y="245" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173d32">ESP32-S3 N16R8</text>
  <text x="155" y="270" font-family="sans-serif" font-size="13" fill="#555">controller board · USB at edge</text>
  <rect x="155" y="290" width="95" height="55" rx="5" fill="#173d32"/>
  <text x="202" y="323" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffffff">USB</text>
  <text x="270" y="315" font-family="monospace" font-size="12" fill="#333">3V3 · GND · GPIO</text>

  <!-- TFT -->
  <rect x="840" y="190" width="400" height="250" rx="8" fill="#dcefe5" stroke="#173d32" stroke-width="3"/>
  <text x="865" y="225" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173d32">2.8" TFT</text>
  <text x="865" y="250" font-family="sans-serif" font-size="13" fill="#555">ILI9341 · SPI · 3.3 V</text>
  <rect x="890" y="280" width="300" height="120" rx="4" fill="#ffffff" stroke="#1d6049"/>
  <text x="1040" y="345" text-anchor="middle" font-family="monospace" font-size="13" fill="#1d6049">240 × 320 active area</text>

  <!-- Sensors -->
  <rect x="130" y="520" width="300" height="200" rx="8" fill="#dcefe5" stroke="#173d32" stroke-width="3"/>
  <text x="155" y="555" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173d32">Sensors</text>
  <text x="155" y="585" font-family="sans-serif" font-size="13" fill="#555">SHT31 + BH1750 on I²C</text>
  <text x="155" y="620" font-family="monospace" font-size="12" fill="#333">SDA GPIO8 / SCL GPIO9</text>
  <text x="155" y="650" font-family="monospace" font-size="12" fill="#333">3.3 V · GND · pull-ups</text>
  <rect x="460" y="560" width="200" height="150" rx="8" fill="#dcefe5" stroke="#173d32" stroke-width="3"/>
  <text x="485" y="595" font-family="sans-serif" font-size="18" font-weight="bold" fill="#173d32">HW-390</text>
  <text x="485" y="625" font-family="monospace" font-size="12" fill="#333">AOUT → GPIO4</text>
  <text x="485" y="655" font-family="monospace" font-size="12" fill="#333">3.3 V · GND</text>

  <!-- Button -->
  <rect x="700" y="520" width="180" height="150" rx="8" fill="#fff3d6" stroke="#e6a100" stroke-width="3"/>
  <text x="725" y="555" font-family="sans-serif" font-size="18" font-weight="bold" fill="#173d32">Button</text>
  <text x="725" y="585" font-family="monospace" font-size="12" fill="#333">3.3 V → GPIO41</text>
  <circle cx="790" cy="630" r="28" fill="#e6a100"/>
  <text x="790" y="636" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#173d32">SW1</text>

  <!-- Relay / pump -->
  <rect x="920" y="520" width="320" height="200" rx="8" fill="#fde8e4" stroke="#c65c4e" stroke-width="3"/>
  <text x="945" y="555" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173d32">Relay / pump</text>
  <text x="945" y="585" font-family="monospace" font-size="12" fill="#333">IN ← GPIO5 · HIGH = ON</text>
  <text x="945" y="615" font-family="monospace" font-size="12" fill="#333">COM/NO → pump +</text>
  <text x="945" y="645" font-family="monospace" font-size="12" fill="#333">10 kΩ pull-down on IN</text>
  <text x="945" y="675" font-family="monospace" font-size="12" fill="#c65c4e">separate pump supply</text>

  <!-- cable notes -->
  <text x="130" y="760" font-family="sans-serif" font-size="13" fill="#555">Keep SPI wires short · route away from pump leads · common ground star point at controller GND</text>
  <text x="130" y="790" font-family="sans-serif" font-size="13" fill="#555">TFT VCC: 100 nF + 470 µF nearby · pump and relay coils: flyback diodes</text>

  <!-- arrows -->
  <line x1="490" y1="315" x2="840" y2="315" stroke="#1d6049" stroke-width="3"/>
  <text x="620" y="300" font-family="sans-serif" font-size="12" fill="#1d6049">SPI + 3.3 V + GND</text>
  <line x1="490" y1="610" x2="840" y2="610" stroke="#1d6049" stroke-width="3"/>
  <text x="610" y="595" font-family="sans-serif" font-size="12" fill="#1d6049">I²C / ADC / button</text>
  <line x1="880" y1="575" x2="920" y2="575" stroke="#c65c4e" stroke-width="3"/>
</svg>
